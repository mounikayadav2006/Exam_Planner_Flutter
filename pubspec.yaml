name: exam_planner
description: "Exam Countdown & Study Planner - Flutter lab project (Experiments 1-5)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Experiment 5 - state management
  provider: ^6.1.2

  # Saves subjects + login on the phone so data survives app restarts
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
